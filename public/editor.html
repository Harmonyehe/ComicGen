
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Comic Editor - COMITALE</title>
      <style>
        body {
          font-family: 'Comic Sans MS', cursive, sans-serif;
          background-color: #f8e6ff;
          margin: 0;
          padding: 0;
          display: flex;
          flex-direction: column;
          min-height: 100vh;
        }
        header {
          background-color: #e951ff;
          color: white;
          padding: 1rem;
          text-align: center;
          box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
          position: relative;
        }
        .logo {
          font-size: 2.5rem;
          font-weight: bold;
          text-shadow: 2px 2px 0 #000;
        }
        main {
          flex: 1;
          padding: 2rem;
          max-width: 1200px;
          margin: 0 auto;
          display: flex;
          flex-direction: column;
        }
        .editor-container {
          background-color: white;
          border: 5px solid #000;
          border-radius: 16px;
          padding: 2rem;
          box-shadow: 8px 8px 0 #000;
          flex: 1;
          display: flex;
          flex-direction: column;
          position: relative;
        }
        .editor-header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 2rem;
          border-bottom: 3px solid #000;
          padding-bottom: 1rem;
        }
        .editor-title {
          font-size: 2rem;
          margin: 0;
          color: #e951ff;
        }
        .editor-controls {
          display: flex;
          gap: 1rem;
        }
        .editor-control {
          padding: 0.5rem 1rem;
          background-color: #e951ff;
          color: white;
          border: 2px solid #000;
          border-radius: 4px;
          font-weight: bold;
          cursor: pointer;
          transition: background-color 0.2s;
        }
        .editor-control:hover {
          background-color: #d33deb;
        }
        .editor-tabs {
          display: flex;
          border-bottom: 3px solid #000;
          margin-bottom: 2rem;
        }
        .editor-tab {
          padding: 0.5rem 1.5rem;
          background-color: #ddd;
          border: 2px solid #000;
          border-bottom: none;
          border-radius: 8px 8px 0 0;
          margin-right: 0.5rem;
          font-weight: bold;
          cursor: pointer;
          position: relative;
          top: 3px;
        }
        .editor-tab.active {
          background-color: #e951ff;
          color: white;
        }
        .editor-content {
          flex: 1;
          display: flex;
          gap: 2rem;
        }
        .editor-workspace {
          flex: 3;
          border: 3px solid #000;
          background-color: #f8f8f8;
          border-radius: 8px;
          padding: 1rem;
          position: relative;
          overflow: auto;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: flex-start;
        }
        .editor-tools {
          flex: 1;
          background-color: #f0f0f0;
          border: 3px solid #000;
          border-radius: 8px;
          padding: 1rem;
          display: flex;
          flex-direction: column;
        }
        .tool-section {
          margin-bottom: 1.5rem;
        }
        .tool-section h3 {
          margin-top: 0;
          color: #e951ff;
          border-bottom: 2px solid #000;
          padding-bottom: 0.5rem;
        }
        .tool-grid {
          display: grid;
          grid-template-columns: repeat(2, 1fr);
          gap: 0.5rem;
        }
        .tool-button {
          padding: 0.5rem;
          background-color: white;
          border: 2px solid #000;
          border-radius: 4px;
          text-align: center;
          cursor: grab;
          transition: all 0.2s;
          position: relative;
        }
        .tool-button.dragging {
          opacity: 0.5;
          border-style: dashed;
          box-shadow: 0 0 8px rgba(233, 81, 255, 0.6);
        }
        .tool-button:hover {
          background-color: #f8e6ff;
          transform: translateY(-2px);
        }
        .tool-button::after {
          content: "Drag me!";
          position: absolute;
          opacity: 0;
          background-color: rgba(0, 0, 0, 0.7);
          color: white;
          padding: 3px 6px;
          border-radius: 4px;
          font-size: 12px;
          pointer-events: none;
          transition: opacity 0.3s;
          right: 0;
          top: 110%;
          white-space: nowrap;
        }
        .tool-button:hover::after {
          opacity: 1;
        }
        .comic-page {
          background-color: white;
          border: 3px solid #000;
          box-shadow: 5px 5px 0 rgba(0, 0, 0, 0.2);
          margin-bottom: 2rem;
          position: relative;
          transition: background-color 0.2s;
        }
        .comic-page.dragover {
          background-color: #f8e6ff;
          box-shadow: 0 0 15px #e951ff;
        }
        .comic-panel {
          position: absolute;
          background-color: white;
          border: 3px solid #000;
          cursor: move;
        }
        .comic-panel::after {
          content: "";
          position: absolute;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          background: repeating-linear-gradient(
            45deg,
            rgba(0, 0, 0, 0.05),
            rgba(0, 0, 0, 0.05) 10px,
            rgba(255, 255, 255, 0.05) 10px,
            rgba(255, 255, 255, 0.05) 20px
          );
          pointer-events: none;
        }
        
        .comic-panel.selected, .character-item.selected, .speech-bubble.selected {
          outline: 3px dashed #e951ff;
          box-shadow: 0 0 10px rgba(233, 81, 255, 0.5);
          z-index: 10;
        }
        .character-item {
          position: absolute;
          cursor: move;
        }
        .character-placeholder {
          width: 60px;
          height: 120px;
          background-color: #e951ff;
          border: 2px solid #000;
          display: flex;
          align-items: center;
          justify-content: center;
          color: white;
          font-weight: bold;
        }
        .speech-bubble {
          position: absolute;
          background-color: white;
          border: 2px solid #000;
          border-radius: 20px;
          padding: 10px;
          min-width: 100px;
          min-height: 40px;
          cursor: move;
        }
        .speech-bubble::before {
          content: "";
          position: absolute;
          bottom: -20px;
          left: 20px;
          border-width: 20px 0 0 20px;
          border-style: solid;
          border-color: #000 transparent transparent transparent;
        }
        .speech-bubble::after {
          content: "";
          position: absolute;
          bottom: -15px;
          left: 23px;
          border-width: 15px 0 0 15px;
          border-style: solid;
          border-color: white transparent transparent transparent;
        }
        .page-controls {
          display: flex;
          justify-content: center;
          gap: 1rem;
          margin-top: 1rem;
        }
        .page-control {
          padding: 0.5rem 1rem;
          background-color: #e951ff;
          color: white;
          border: 2px solid #000;
          border-radius: 4px;
          font-weight: bold;
          cursor: pointer;
          transition: background-color 0.2s;
        }
        .page-control:hover {
          background-color: #d33deb;
        }
        .page-preview {
          width: 100%;
          height: 600px;
          margin-bottom: 2rem;
          text-align: center;
          display: flex;
          align-items: center;
          justify-content: center;
          flex-direction: column;
        }
        .page-preview h2 {
          color: #e951ff;
          margin-bottom: 1rem;
        }
        footer {
          background-color: #333;
          color: white;
          text-align: center;
          padding: 1rem;
          margin-top: auto;
        }
        .nav-links {
          position: absolute;
          top: 1rem;
          right: 1rem;
        }
        .nav-links a {
          display: inline-block;
          margin-left: 1rem;
          padding: 0.5rem 1rem;
          background-color: white;
          color: #e951ff;
          text-decoration: none;
          border: 2px solid #000;
          border-radius: 4px;
          font-weight: bold;
          box-shadow: 2px 2px 0 #000;
          transition: transform 0.2s;
        }
        .nav-links a:hover {
          transform: translateY(-2px);
          box-shadow: 3px 3px 0 #000;
        }
        @media (max-width: 768px) {
          .editor-content {
            flex-direction: column;
          }
          .nav-links {
            position: static;
            margin-top: 1rem;
            text-align: center;
          }
        }
      </style>
    </head>
    <body>
      <header>
        <div class="logo">COMITALE</div>
        <div class="nav-links">
          <a href="/">Home</a>
          <a href="/comics.html">My Comics</a>
        </div>
      </header>
      <main>
        <div class="editor-container">
          <div class="editor-header">
            <h1 class="editor-title" id="comic-title">Comic Title</h1>
            <div class="editor-controls">
              <button class="editor-control" id="save-button">Save</button>
              <button class="editor-control" id="preview-button">Preview</button>
            </div>
          </div>
          <div class="editor-tabs">
            <div class="editor-tab active" data-tab="edit">Edit</div>
            <div class="editor-tab" data-tab="characters">Characters</div>
            <div class="editor-tab" data-tab="settings">Settings</div>
          </div>
          <div class="editor-content">
            <div class="editor-workspace">
              <div id="comic-page" class="comic-page" style="width: 800px; height: 1000px; position: relative;">
                <!-- Comic panels and elements will be added here dynamically -->
              </div>
              <div class="page-controls">
                <button class="page-control" id="prev-page">Previous Page</button>
                <span id="page-indicator">Page 1</span>
                <button class="page-control" id="next-page">Next Page</button>
              </div>
            </div>
            <div class="editor-tools">
              <div class="tool-section">
                <h3>Add Elements</h3>
                <div class="tool-grid">
                  <div class="tool-button" id="add-panel">Panel</div>
                  <div class="tool-button" id="add-character">Character</div>
                  <div class="tool-button" id="add-speech">Speech</div>
                  <div class="tool-button" id="add-caption">Caption</div>
                </div>
              </div>
              <div class="tool-section" id="character-section" style="display: none;">
                <h3>Characters</h3>
                <div id="character-list">
                  <!-- Characters will be listed here -->
                </div>
                <button class="editor-control" id="add-new-character" style="margin-top: 10px;">Add New Character</button>
              </div>
              <div class="tool-section">
                <h3>Panel Layout</h3>
                <div class="tool-grid">
                  <div class="tool-button" id="layout-1">1 Panel</div>
                  <div class="tool-button" id="layout-2">2 Panels</div>
                  <div class="tool-button" id="layout-3">3 Panels</div>
                  <div class="tool-button" id="layout-4">4 Panels</div>
                </div>
              </div>
              <div class="tool-section">
                <h3>Selected Element</h3>
                <div id="element-properties">
                  <p>No element selected</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
      <footer>
        <p>&copy; 2025 COMITALE. All rights reserved.</p>
      </footer>
      <script>
        // Check authentication status on page load
        checkAuthStatus();
        
        // Global variables
        let currentPage = 1;
        let comicData = {
          title: 'Comic Editor',
          format: 'classic',
          pages: [{
            pageNumber: 1,
            panels: [],
            characters: [],
            dialogues: []
          }]
        };
        let selectedElement = null;
        let characters = [];
        let isDragging = false;
        let dragOffsetX = 0;
        let dragOffsetY = 0;
        let currentPageData = comicData.pages[0];
        let nextElementId = 1;
        
        async function checkAuthStatus() {
          try {
            const response = await fetch('/api/users/me');
            if (!response.ok) {
              // User is not logged in, redirect to login
              alert('Please log in to use the editor');
              window.location.href = '/login.html';
            }
          } catch (error) {
            console.error('Auth check error:', error);
          }
        }
        
        // Get comic ID from URL parameters
        const params = new URLSearchParams(window.location.search);
        const comicId = params.get('id');
        
        if (!comicId) {
          alert('No comic ID provided');
          window.location.href = '/comics.html';
        } else {
          loadComicData(comicId);
        }
        
        // Load comic data from the server
        async function loadComicData(id) {
          try {
            const response = await fetch(`/api/comics/${id}`);
            if (response.ok) {
              const comic = await response.json();
              document.getElementById('comic-title').textContent = comic.title;
              comicData.title = comic.title;
              comicData.format = comic.format;
              
              // Load comic pages
              const pagesResponse = await fetch(`/api/comics/${id}/pages`);
              if (pagesResponse.ok) {
                const pages = await pagesResponse.json();
                if (pages.length > 0) {
                  comicData.pages = pages.map(page => {
                    return {
                      id: page.id,
                      pageNumber: page.pageNumber,
                      ...JSON.parse(page.content)
                    };
                  }).sort((a, b) => a.pageNumber - b.pageNumber);
                }
              }
              
              // Load characters
              const charactersResponse = await fetch(`/api/comics/${id}/characters`);
              if (charactersResponse.ok) {
                characters = await charactersResponse.json();
                updateCharacterList();
              }
              
              // Initialize the first page
              if (comicData.pages.length > 0) {
                currentPageData = comicData.pages[0];
                renderCurrentPage();
              }
            } else {
              console.error('Failed to load comic data');
            }
          } catch (error) {
            console.error('Error loading comic data:', error);
          }
        }
        
        // Render the current page
        function renderCurrentPage() {
          const pageElement = document.getElementById('comic-page');
          pageElement.innerHTML = '';
          document.getElementById('page-indicator').textContent = `Page ${currentPage}`;
          
          // Set page size based on comic format
          switch (comicData.format) {
            case 'webtoon':
              pageElement.style.width = '600px';
              pageElement.style.height = '1500px';
              break;
            case 'manga':
              pageElement.style.width = '700px';
              pageElement.style.height = '1000px';
              break;
            case 'instagram':
              pageElement.style.width = '600px';
              pageElement.style.height = '600px';
              break;
            default: // classic
              pageElement.style.width = '800px';
              pageElement.style.height = '1000px';
          }
          
          // Render panels
          if (currentPageData.panels) {
            currentPageData.panels.forEach(panel => {
              createPanelElement(panel);
            });
          }
          
          // Render characters
          if (currentPageData.characters) {
            currentPageData.characters.forEach(charPlacement => {
              const character = characters.find(c => c.id === charPlacement.characterId);
              if (character) {
                createCharacterElement(charPlacement, character);
              }
            });
          }
          
          // Render dialogues
          if (currentPageData.dialogues) {
            currentPageData.dialogues.forEach(dialogue => {
              createDialogueElement(dialogue);
            });
          }
        }
        
        // Create a panel element
        function createPanelElement(panel) {
          const panelElement = document.createElement('div');
          panelElement.className = 'comic-panel';
          panelElement.dataset.id = panel.id;
          panelElement.dataset.type = 'panel';
          panelElement.style.left = panel.x + 'px';
          panelElement.style.top = panel.y + 'px';
          panelElement.style.width = panel.width + 'px';
          panelElement.style.height = panel.height + 'px';
          
          if (panel.rotation) {
            panelElement.style.transform = `rotate(${panel.rotation}deg)`;
          }
          
          panelElement.addEventListener('mousedown', startDrag);
          panelElement.addEventListener('click', selectElement);
          
          document.getElementById('comic-page').appendChild(panelElement);
        }
        
        // Create a character element
        function createCharacterElement(placement, character) {
          const charElement = document.createElement('div');
          charElement.className = 'character-item';
          charElement.dataset.id = placement.id;
          charElement.dataset.characterId = character.id;
          charElement.dataset.type = 'character';
          charElement.style.left = placement.x + 'px';
          charElement.style.top = placement.y + 'px';
          
          if (character.imageUrl) {
            const img = document.createElement('img');
            img.src = character.imageUrl;
            img.alt = character.name;
            img.style.maxHeight = '180px';
            charElement.appendChild(img);
          } else {
            // Create a placeholder for the character
            const placeholder = document.createElement('div');
            placeholder.className = 'character-placeholder';
            placeholder.textContent = character.name.substring(0, 2).toUpperCase();
            charElement.appendChild(placeholder);
          }
          
          charElement.addEventListener('mousedown', startDrag);
          charElement.addEventListener('click', selectElement);
          
          document.getElementById('comic-page').appendChild(charElement);
        }
        
        // Create a dialogue/speech bubble element
        function createDialogueElement(dialogue) {
          const bubbleElement = document.createElement('div');
          bubbleElement.className = 'speech-bubble';
          bubbleElement.dataset.id = dialogue.id;
          bubbleElement.dataset.type = 'dialogue';
          bubbleElement.style.left = dialogue.x + 'px';
          bubbleElement.style.top = dialogue.y + 'px';
          bubbleElement.textContent = dialogue.text;
          
          bubbleElement.addEventListener('mousedown', startDrag);
          bubbleElement.addEventListener('click', selectElement);
          
          document.getElementById('comic-page').appendChild(bubbleElement);
        }
        
        // Start dragging an element
        function startDrag(e) {
          e.preventDefault();
          e.stopPropagation();
          
          selectElement(e);
          
          const element = e.currentTarget;
          isDragging = true;
          
          // Calculate the offset of the mouse pointer relative to the element
          const rect = element.getBoundingClientRect();
          dragOffsetX = e.clientX - rect.left;
          dragOffsetY = e.clientY - rect.top;
          
          // Add global mouse move and up handlers
          document.addEventListener('mousemove', dragElement);
          document.addEventListener('mouseup', stopDrag);
        }
        
        // Drag the element
        function dragElement(e) {
          if (isDragging && selectedElement) {
            e.preventDefault();
            
            // Get page position
            const pageRect = document.getElementById('comic-page').getBoundingClientRect();
            
            // Calculate new position
            let x = e.clientX - pageRect.left - dragOffsetX;
            let y = e.clientY - pageRect.top - dragOffsetY;
            
            // Constrain to page boundaries
            x = Math.max(0, Math.min(x, pageRect.width - selectedElement.offsetWidth));
            y = Math.max(0, Math.min(y, pageRect.height - selectedElement.offsetHeight));
            
            // Update element position
            selectedElement.style.left = x + 'px';
            selectedElement.style.top = y + 'px';
            
            // Update data model
            const type = selectedElement.dataset.type;
            const id = selectedElement.dataset.id;
            
            if (type === 'panel') {
              const panelIndex = currentPageData.panels.findIndex(p => p.id === id);
              if (panelIndex !== -1) {
                currentPageData.panels[panelIndex].x = x;
                currentPageData.panels[panelIndex].y = y;
              }
            } else if (type === 'character') {
              const charIndex = currentPageData.characters.findIndex(c => c.id === id);
              if (charIndex !== -1) {
                currentPageData.characters[charIndex].x = x;
                currentPageData.characters[charIndex].y = y;
              }
            } else if (type === 'dialogue') {
              const dialogueIndex = currentPageData.dialogues.findIndex(d => d.id === id);
              if (dialogueIndex !== -1) {
                currentPageData.dialogues[dialogueIndex].x = x;
                currentPageData.dialogues[dialogueIndex].y = y;
              }
            }
          }
        }
        
        // Stop dragging
        function stopDrag() {
          isDragging = false;
          document.removeEventListener('mousemove', dragElement);
          document.removeEventListener('mouseup', stopDrag);
        }
        
        // Select an element
        function selectElement(e) {
          // Deselect previously selected element
          if (selectedElement) {
            selectedElement.classList.remove('selected');
          }
          
          // Select the new element
          selectedElement = e.currentTarget;
          selectedElement.classList.add('selected');
          
          // Show properties for the selected element
          showElementProperties(selectedElement);
        }
        
        // Show properties for the selected element
        function showElementProperties(element) {
          const propertiesDiv = document.getElementById('element-properties');
          const type = element.dataset.type;
          
          let html = '';
          if (type === 'panel') {
            const panelIndex = currentPageData.panels.findIndex(p => p.id === element.dataset.id);
            const panel = currentPageData.panels[panelIndex];
            
            html = `
              <div>
                <label>Width:</label>
                <input type="number" id="panel-width" value="${panel.width}" min="100" max="800">
              </div>
              <div>
                <label>Height:</label>
                <input type="number" id="panel-height" value="${panel.height}" min="100" max="800">
              </div>
              <div>
                <label>Rotation:</label>
                <input type="number" id="panel-rotation" value="${panel.rotation || 0}" min="-15" max="15">
              </div>
              <button class="editor-control" id="update-panel">Update Panel</button>
              <button class="editor-control" id="delete-panel" style="background-color: #ff5555;">Delete</button>
            `;
          } else if (type === 'character') {
            const charIndex = currentPageData.characters.findIndex(c => c.id === element.dataset.id);
            const charPlacement = currentPageData.characters[charIndex];
            const character = characters.find(c => c.id === charPlacement.characterId);
            
            html = `
              <div>
                <p><strong>Character:</strong> ${character ? character.name : 'Unknown'}</p>
              </div>
              <div>
                <label>Scale:</label>
                <input type="number" id="character-scale" value="${charPlacement.scale || 100}" min="50" max="150">
              </div>
              <div>
                <label>Flip:</label>
                <input type="checkbox" id="character-flip" ${charPlacement.flipped ? 'checked' : ''}>
              </div>
              <button class="editor-control" id="update-character">Update Character</button>
              <button class="editor-control" id="delete-character" style="background-color: #ff5555;">Delete</button>
            `;
          } else if (type === 'dialogue') {
            const dialogueIndex = currentPageData.dialogues.findIndex(d => d.id === element.dataset.id);
            const dialogue = currentPageData.dialogues[dialogueIndex];
            
            html = `
              <div>
                <label>Text:</label>
                <textarea id="dialogue-text">${dialogue.text}</textarea>
              </div>
              <div>
                <label>Style:</label>
                <select id="dialogue-style">
                  <option value="speech" ${dialogue.style === 'speech' ? 'selected' : ''}>Speech Bubble</option>
                  <option value="thought" ${dialogue.style === 'thought' ? 'selected' : ''}>Thought Bubble</option>
                  <option value="caption" ${dialogue.style === 'caption' ? 'selected' : ''}>Caption</option>
                </select>
              </div>
              <button class="editor-control" id="update-dialogue">Update Text</button>
              <button class="editor-control" id="delete-dialogue" style="background-color: #ff5555;">Delete</button>
            `;
          }
          
          propertiesDiv.innerHTML = html;
          
          // Add event listeners to the new buttons
          if (type === 'panel') {
            document.getElementById('update-panel').addEventListener('click', updatePanel);
            document.getElementById('delete-panel').addEventListener('click', deletePanel);
          } else if (type === 'character') {
            document.getElementById('update-character').addEventListener('click', updateCharacter);
            document.getElementById('delete-character').addEventListener('click', deleteCharacter);
          } else if (type === 'dialogue') {
            document.getElementById('update-dialogue').addEventListener('click', updateDialogue);
            document.getElementById('delete-dialogue').addEventListener('click', deleteDialogue);
          }
        }
        
        // Update the character list in the sidebar
        function updateCharacterList() {
          const characterList = document.getElementById('character-list');
          characterList.innerHTML = '';
          
          characters.forEach(character => {
            const characterItem = document.createElement('div');
            characterItem.className = 'character-item-list';
            characterItem.style.display = 'flex';
            characterItem.style.alignItems = 'center';
            characterItem.style.marginBottom = '10px';
            characterItem.style.padding = '5px';
            characterItem.style.border = '1px solid #ccc';
            characterItem.style.borderRadius = '4px';
            
            // Character image or placeholder

        // Handle the start of drag from toolbox
        function handleToolDragStart(e) {
          draggedToolType = e.target.id;
          e.dataTransfer.setData('text/plain', e.target.id);
          e.dataTransfer.effectAllowed = 'copy';
          
          // Add visual feedback class
          e.target.classList.add('dragging');
        }
        
        // Handle the end of dragging (cleanup if dropped outside valid target)
        function handleToolDragEnd(e) {
          // Remove any highlight classes that might still be active
          document.getElementById('comic-page').classList.remove('dragover');
          // Remove the dragging style from the button
          e.target.classList.remove('dragging');
          draggedToolType = null;
        }
        
        // Handle dragover to enable drop
        function handleDragOver(e) {
          if (draggedToolType) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'copy';
            
            // Add highlight class to show drop zone
            e.currentTarget.classList.add('dragover');
            
            // Remove highlight after a short delay when not hovering
            setTimeout(() => {
              if (!e.currentTarget.matches(':hover')) {
                e.currentTarget.classList.remove('dragover');
              }
            }, 100);
          }
        }
        
        // Handle the drop of a tool onto the comic page
        function handleToolDrop(e) {
          e.preventDefault();
          
          // Remove the highlight class
          e.currentTarget.classList.remove('dragover');
          
          if (!draggedToolType) return;
          
          // Remove dragging class from the source element
          document.querySelectorAll('.tool-button.dragging').forEach(btn => {
            btn.classList.remove('dragging');
          });
          
          // Calculate position relative to comic page
          const rect = comicPage.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          
          // Handle different tool types
          switch(draggedToolType) {
            case 'add-panel':
              addPanelAt(x, y);
              break;
            case 'add-speech':
              addSpeechBubbleAt(x, y);
              break;
            case 'add-caption':
              addCaptionAt(x, y);
              break;
            case 'add-character':
              // Show character selection dialog at position
              showCharacterSelectionAt(x, y);
              break;

            alert('No characters available. Please add characters first.');
            
            // Show the characters tab
            const characterTab = document.querySelector('.editor-tab[data-tab="characters"]');
            if (characterTab) {
              characterTab.click();
            }
            return;
          }
          
          // Create character selection popup
          const popup = document.createElement('div');
          popup.className = 'character-selection-popup';
          popup.style.position = 'absolute';
          popup.style.left = x + 'px';
          popup.style.top = y + 'px';
          popup.style.backgroundColor = 'white';
          popup.style.border = '3px solid #000';
          popup.style.borderRadius = '8px';
          popup.style.padding = '10px';
          popup.style.zIndex = '1000';
          popup.style.maxHeight = '300px';
          popup.style.overflowY = 'auto';
          
          // Add heading
          const heading = document.createElement('h4');
          heading.textContent = 'Select Character';
          heading.style.marginTop = '0';
          popup.appendChild(heading);
          
          // Add character options
          characters.forEach(character => {
            const option = document.createElement('div');
            option.className = 'character-option';
            option.textContent = character.name;
            option.style.padding = '5px';
            option.style.cursor = 'pointer';
            option.style.borderBottom = '1px solid #eee';
            
            option.addEventListener('click', function() {
              const newCharPlacement = {
                id: 'char_' + nextElementId++,
                characterId: character.id,
                x: x,
                y: y
              };
              
              if (!currentPageData.characters) {
                currentPageData.characters = [];
              }
              
              currentPageData.characters.push(newCharPlacement);
              const element = createCharacterElement(newCharPlacement, character);
              
              // Select the newly created element
              selectElement({ currentTarget: element });
              
              // Remove popup
              document.getElementById('comic-page').removeChild(popup);
            });
            
            popup.appendChild(option);
          });
          
          // Add close button
          const closeBtn = document.createElement('button');
          closeBtn.textContent = 'Cancel';
          closeBtn.style.marginTop = '10px';
          closeBtn.style.padding = '5px 10px';
          closeBtn.style.backgroundColor = '#e951ff';
          closeBtn.style.color = 'white';
          closeBtn.style.border = '2px solid #000';
          closeBtn.style.borderRadius = '4px';
          closeBtn.style.cursor = 'pointer';
          
          closeBtn.addEventListener('click', function() {
            document.getElementById('comic-page').removeChild(popup);
          });
          
          popup.appendChild(closeBtn);
          document.getElementById('comic-page').appendChild(popup);
        }
      </script>
    </body>
    </html>
