
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>My Comics - COMITALE</title>
      <style>
        body {
          font-family: 'Comic Sans MS', cursive, sans-serif;
          background-color: #f8e6ff;
          margin: 0;
          padding: 0;
          display: flex;
          flex-direction: column;
          min-height: 100vh;
        }
        header {
          background-color: #e951ff;
          color: white;
          padding: 1rem;
          text-align: center;
          box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
          position: relative;
        }
        .logo {
          font-size: 2.5rem;
          font-weight: bold;
          text-shadow: 2px 2px 0 #000;
        }
        main {
          flex: 1;
          padding: 2rem;
          max-width: 1200px;
          margin: 0 auto;
        }
        .comics-container {
          background-color: white;
          border: 5px solid #000;
          border-radius: 16px;
          padding: 2rem;
          box-shadow: 8px 8px 0 #000;
        }
        .comics-container h1 {
          font-size: 2.5rem;
          color: #e951ff;
          text-align: center;
          margin-top: 0;
        }
        .comics-grid {
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
          gap: 2rem;
          margin-top: 2rem;
        }
        .comic-card {
          border: 3px solid #000;
          border-radius: 8px;
          overflow: hidden;
          box-shadow: 5px 5px 0 #000;
          transition: transform 0.3s;
          transform: rotate(-1deg);
          background-color: white;
          position: relative;
        }
        .comic-card:nth-child(2n) {
          transform: rotate(1deg);
        }
        .comic-card:nth-child(3n) {
          transform: rotate(-0.5deg);
        }
        .comic-card:hover {
          transform: rotate(0) scale(1.03);
          z-index: 1;
        }
        .comic-cover {
          height: 200px;
          background-color: #ffcc00;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 3rem;
          font-weight: bold;
          color: #e951ff;
          text-shadow: 2px 2px 0 #000;
          border-bottom: 3px solid #000;
        }
        .comic-info {
          padding: 1rem;
        }
        .comic-info h3 {
          margin-top: 0;
          color: #e951ff;
          font-size: 1.5rem;
        }
        .comic-info p {
          margin: 0.5rem 0;
          color: #333;
        }
        .comic-format {
          position: absolute;
          top: 0.5rem;
          left: 0.5rem;
          background-color: #e951ff;
          color: white;
          padding: 0.25rem 0.5rem;
          border-radius: 4px;
          font-size: 0.8rem;
          font-weight: bold;
          text-transform: uppercase;
          border: 2px solid #000;
        }
        .comic-buttons {
          display: flex;
          gap: 0.5rem;
          margin-top: 1rem;
        }
        .comic-button {
          flex: 1;
          padding: 0.5rem;
          text-align: center;
          background-color: #e951ff;
          color: white;
          border: 2px solid #000;
          border-radius: 4px;
          font-weight: bold;
          text-decoration: none;
          cursor: pointer;
          transition: background-color 0.2s;
        }
        .comic-button:hover {
          background-color: #d33deb;
        }
        .delete-button {
          background-color: #ff4d4d;
        }
        .delete-button:hover {
          background-color: #e63939;
        }
        .empty-state {
          text-align: center;
          margin: 4rem 0;
        }
        .empty-state h2 {
          color: #e951ff;
        }
        .create-button {
          display: inline-block;
          padding: 1rem 2rem;
          margin-top: 1rem;
          background-color: #e951ff;
          color: white;
          font-size: 1.2rem;
          text-decoration: none;
          border: 3px solid #000;
          border-radius: 8px;
          font-weight: bold;
          box-shadow: 3px 3px 0 #000;
          transition: transform 0.2s, box-shadow 0.2s;
        }
        .create-button:hover {
          transform: translateY(-2px);
          box-shadow: 5px 5px 0 #000;
        }
        footer {
          background-color: #333;
          color: white;
          text-align: center;
          padding: 1rem;
          margin-top: auto;
        }
        .nav-links {
          position: absolute;
          top: 1rem;
          right: 1rem;
        }
        .nav-links a {
          display: inline-block;
          margin-left: 1rem;
          padding: 0.5rem 1rem;
          background-color: white;
          color: #e951ff;
          text-decoration: none;
          border: 2px solid #000;
          border-radius: 4px;
          font-weight: bold;
          box-shadow: 2px 2px 0 #000;
          transition: transform 0.2s;
        }
        .nav-links a:hover {
          transform: translateY(-2px);
          box-shadow: 3px 3px 0 #000;
        }
        @media (max-width: 768px) {
          .comics-container h1 {
            font-size: 2rem;
          }
          .comics-grid {
            grid-template-columns: 1fr;
          }
          .nav-links {
            position: static;
            margin-top: 1rem;
            text-align: center;
          }
        }
      </style>
    </head>
    <body>
      <header>
        <div class="logo">COMITALE</div>
        <div class="nav-links">
          <a href="/">Home</a>
          <a href="/create-comic.html">Create Comic</a>
          <a href="/login.html" id="loginLink">Login</a>
          <span id="userControls" style="display: none;">
            <a href="/api/users/logout" id="logoutLink">Logout</a>
          </span>
        </div>
      </header>
      <main>
        <div class="comics-container">
          <h1>My Comics</h1>
          <div id="comics-content">
            <div class="empty-state">
              <h2>You don't have any comics yet</h2>
              <p>Create your first comic to get started!</p>
              <a href="/create-comic.html" class="create-button">Create Comic</a>
            </div>
            <div id="comics-grid" class="comics-grid" style="display: none;">
              <!-- Comic cards will be inserted here by JavaScript -->
            </div>
          </div>
        </div>
      </main>
      <footer>
        <p>&copy; 2025 COMITALE. All rights reserved.</p>
      </footer>
      <script>
        // Check authentication status on page load
        checkAuthStatus();
        
        async function checkAuthStatus() {
          try {
            const response = await fetch('/api/users/me');
            if (response.ok) {
              // User is logged in
              document.getElementById('loginLink').style.display = 'none';
              document.getElementById('userControls').style.display = 'inline-block';
              
              // Load comics
              loadComics();
            } else {
              // User is not logged in, redirect to login
              alert('Please log in to view your comics');
              window.location.href = '/login.html';
            }
          } catch (error) {
            console.error('Auth check error:', error);
          }
        }
        
        // Handle logout
        document.getElementById('logoutLink').addEventListener('click', async function(e) {
          e.preventDefault();
          
          try {
            const response = await fetch('/api/users/logout', {
              method: 'POST'
            });
            
            if (response.ok) {
              alert('Logged out successfully');
              window.location.href = '/';
            }
          } catch (error) {
            console.error('Logout error:', error);
          }
        });
        
        // Load user's comics
        async function loadComics() {
          try {
            const response = await fetch('/api/comics');
            
            if (response.ok) {
              const comics = await response.json();
              
              if (comics.length > 0) {
                document.querySelector('.empty-state').style.display = 'none';
                document.getElementById('comics-grid').style.display = 'grid';
                
                // Render comics
                const comicsGrid = document.getElementById('comics-grid');
                comicsGrid.innerHTML = '';
                
                comics.forEach(comic => {
                  const comicCard = document.createElement('div');
                  comicCard.className = 'comic-card';
                  comicCard.innerHTML = `
                    <div class="comic-format">${comic.format}</div>
                    <div class="comic-cover">${comic.title.charAt(0)}</div>
                    <div class="comic-info">
                      <h3>${comic.title}</h3>
                      <p>${comic.description || 'No description'}</p>
                      <p>Style: ${comic.artStyle}</p>
                      <p>Created: ${new Date(comic.createdAt).toLocaleDateString()}</p>
                      <div class="comic-buttons">
                        <a href="/editor.html?id=${comic.id}" class="comic-button">Edit</a>
                        <button class="comic-button delete-button" data-id="${comic.id}">Delete</button>
                      </div>
                    </div>
                  `;
                  
                  comicsGrid.appendChild(comicCard);
                });
                
                // Add event listeners for delete buttons
                document.querySelectorAll('.delete-button').forEach(button => {
                  button.addEventListener('click', handleDeleteComic);
                });
              }
            } else {
              console.error('Failed to load comics');
            }
          } catch (error) {
            console.error('Load comics error:', error);
          }
        }
        
        // Handle comic deletion
        async function handleDeleteComic() {
          const comicId = this.dataset.id;
          
          if (confirm('Are you sure you want to delete this comic? This action cannot be undone.')) {
            try {
              const response = await fetch(`/api/comics/${comicId}`, {
                method: 'DELETE'
              });
              
              if (response.ok) {
                alert('Comic deleted successfully');
                // Reload the comics list
                loadComics();
              } else {
                const data = await response.json();
                alert(`Failed to delete comic: ${data.error || 'Unknown error'}`);
              }
            } catch (error) {
              console.error('Delete comic error:', error);
              alert('Failed to delete comic. Please try again.');
            }
          }
        }
      </script>
    </body>
    </html>
